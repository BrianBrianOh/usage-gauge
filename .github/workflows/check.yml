name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/check_publication.py
      - run: zsh native/build.sh
      - run: '"dist/Usage Gauge.app/Contents/MacOS/UsageGauge" --self-test'
